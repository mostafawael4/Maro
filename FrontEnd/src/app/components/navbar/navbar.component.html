<nav class="navbar-cinematic fixed top-0 left-0 right-0 z-50 backdrop-blur-sm border-b shadow-sm" style="border-bottom-color: rgba(200, 155, 123, 0.15);" [ngStyle]="{ 'background-color': navbarBgColor }">
  <div class="container mx-auto px-4 lg:px-6 ">
    <div class="flex items-center justify-between h-20 lg:h-24">
      
      <!-- Logo Section (image only) -->
      <div class="flex items-center mt-2">
        <img 
          src="assets/images/maroLogo.avif" 
          alt="Maro Weddings Logo" 
          class="w-[180px] object-contain navbar-logo-img"
        />
      </div>

      <!-- Desktop Navigation Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a 
          *ngIf="isAuthenticated"
          routerLink="/dashboard" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Dashboard
        </a>
        <a 
          routerLink="/" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}"
          class="nav-link-desktop"
        >
          Home
        </a>
        <a 
          routerLink="/packages" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Packages
        </a>
        <a 
          routerLink="/gallery" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Gallery
        </a>
        <a 
          routerLink="/faqs" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          FAQs
        </a>
        <a 
          routerLink="/orders" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Orders
        </a>
        <a 
          routerLink="/feedbacks" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Feedbacks
        </a>
        <a 
          routerLink="/contact" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-desktop"
        >
          Contact Us
        </a>
        <button 
          *ngIf="isAuthenticated"
          (click)="onLogout()"
          class="nav-link-desktop logout-btn-desktop px-4 py-2 rounded-lg transition-all duration-200"
          style="background-color: rgba(200, 155, 123, 0.1); border: 1px solid rgba(200, 155, 123, 0.3);"
        >
          Logout
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button 
        class="md:hidden p-2 rounded-lg transition-colors duration-200"
        style="color: #333333;"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle mobile menu"
      >
        <svg 
          class="h-6 w-6 transition-transform duration-200"
          [class.rotate-90]="isMobileMenuOpen"
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
        >
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2" 
            [attr.d]="isMobileMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"
          />
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation Menu -->
    <div 
      class="md:hidden transition-all duration-300 ease-in-out overflow-hidden"
      [class.max-h-0]="!isMobileMenuOpen"
      [class.max-h-96]="isMobileMenuOpen"
    >
      <div class="py-4 space-y-2 border-t" style="border-top-color: rgba(200, 155, 123, 0.15);">
        <a 
          routerLink="/" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Home
          </span>
        </a>
        
        <a 
          routerLink="/packages" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            Packages
          </span>
        </a>
        
        <a 
          routerLink="/gallery" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Gallery
          </span>
        </a>
        
        <a 
          routerLink="/faqs" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            FAQs
          </span>
        </a>
        
        <a 
          *ngIf="isAuthenticated"
          routerLink="/dashboard" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Dashboard
          </span>
        </a>
        
        <a 
          routerLink="/orders" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Orders
          </span>
        </a>
        
        <a 
          routerLink="/feedbacks" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            Feedbacks
          </span>
        </a>
        
        <a 
          routerLink="/contact" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: false}"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200"
          (click)="closeMobileMenu()"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Contact Us
          </span>
        </a>
        
        <button 
          *ngIf="isAuthenticated"
          (click)="onLogout()"
          class="nav-link-mobile block px-4 py-3 rounded-lg transition-all duration-200 w-full text-left"
          style="background-color: rgba(200, 155, 123, 0.1); border: 1px solid rgba(200, 155, 123, 0.3);"
        >
          <span class="flex items-center">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Logout
          </span>
        </button>
        
      </div>
    </div>
  </div>
</nav>

<!-- Spacer for fixed navbar -->
<div class="h-20 lg:h-24"></div>
