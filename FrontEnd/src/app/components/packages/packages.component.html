<div class="packages-page">
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">Our Packages</h1>
    <p class="page-description">
      Discover our carefully crafted packages designed to capture every precious moment of your special day
    </p>
  </div>

  <!-- Package Categories Navigation -->
  <div class="categories-nav">
    <button 
      class="category-btn" 
      [class.active]="isActive('cinematography')"
      (click)="switchSection('cinematography')"
    >
      <svg class="category-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      Cinematography
    </button>

    <button 
      class="category-btn" 
      [class.active]="isActive('photography')"
      (click)="switchSection('photography')"
    >
      <svg class="category-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      Photography
    </button>

    <button 
      class="category-btn" 
      [class.active]="isActive('fullrecording')"
      (click)="switchSection('fullrecording')"
    >
      <svg class="category-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
      </svg>
      Full Recording
    </button>
  </div>

  <!-- Package Content (Router Outlet for child routes) -->
  <div class="package-content">
    <router-outlet></router-outlet>
  </div>
</div>
