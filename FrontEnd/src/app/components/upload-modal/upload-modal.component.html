<!-- Upload Modal -->
<div *ngIf="show" class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Upload Images</h2>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>
    
    <div class="modal-body">
      <!-- File Input -->
      <div class="file-input-container">
        <label 
          for="file-input" 
          class="file-input-label"
          [class.dragging]="isDragging"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span *ngIf="!isDragging">Click to select images or drag and drop</span>
          <span *ngIf="isDragging" class="drop-here">Drop images here</span>
          <input 
            id="file-input" 
            type="file" 
            multiple 
            accept="image/*" 
            (change)="onFileSelected($event)"
            style="display: none;"
          />
        </label>
      </div>

      <!-- Selected Files Preview -->
      <div *ngIf="selectedFiles.length > 0" class="selected-files">
        <h3>Selected Files ({{ selectedFiles.length }})</h3>
        <div class="file-list">
          <div *ngFor="let file of selectedFiles; let i = index" class="file-item">
            <span class="file-name">{{ file.name }}</span>
            <button class="remove-file-btn" (click)="removeFile(i)" [disabled]="isUploading">
              &times;
            </button>
          </div>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="uploadSuccess" class="success-message">
        {{ uploadSuccess }}
      </div>

      <!-- Error Message -->
      <div *ngIf="uploadError" class="error-message">
        {{ uploadError }}
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="close()" [disabled]="isUploading">
        Cancel
      </button>
      <button 
        class="upload-submit-btn" 
        (click)="uploadImages()" 
        [disabled]="selectedFiles.length === 0 || isUploading"
      >
        <span *ngIf="!isUploading">Upload</span>
        <span *ngIf="isUploading">Uploading...</span>
      </button>
    </div>
  </div>
</div>
