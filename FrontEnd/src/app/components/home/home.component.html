<div class="home-container">
  <div class="header">
    <h1>MARO WEDDINGS</h1>
    <p>"Where timeless memories meet soulful storytelling."</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
  </div>

  <!-- Photo Grid -->
  <div *ngIf="!isLoading" class="photo-grid">
    <div 
      *ngFor="let image of images; let i = index" 
      class="photo-item"
      [attr.data-index]="i"
      [class.animate-in]="isImageVisible(i)"
    >
      <img 
        [src]="getImageUrl(image)" 
        [alt]="image.filename"
        (load)="onImageLoad(i)"
        [class.loaded]="isImageLoaded(i)"
      />
    </div>
  </div>
</div>
