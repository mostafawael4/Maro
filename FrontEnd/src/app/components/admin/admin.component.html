<div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-md bg-black/80" (click)="closeModal()">
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8" (click)="$event.stopPropagation()">
    
    <!-- Close Button -->
    <button 
      (click)="closeModal()" 
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
      aria-label="Close"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Loading State (while waiting for client-side initialization) -->
    <div *ngIf="!isClientReady" class="flex flex-col items-center justify-center py-12">
      <svg class="animate-spin h-12 w-12 text-[#8B3A3A] mb-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="text-gray-600 text-sm">Loading...</p>
    </div>

    <!-- Login Form -->
    <div *ngIf="isClientReady && !isAuthenticated">
      <h2 class="text-3xl font-bold text-gray-800 mb-8">Admin Login</h2>
      
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Floating Label Input -->
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder=" "
            class="peer w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-[#8B3A3A] focus:outline-none transition-colors"
            [disabled]="isLoading"
            autocomplete="current-password"
          />
          <label 
            for="password"
            class="absolute left-4 top-3 text-gray-500 transition-all duration-200 
                   peer-placeholder-shown:top-3 peer-placeholder-shown:text-base 
                   peer-focus:-top-6 peer-focus:text-sm peer-focus:text-[#8B3A3A]
                   -top-6 text-sm"
          >
            Password
          </label>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-gradient-to-r from-[#6B1F1F] to-[#8B3A3A] text-white py-3 px-6 rounded-lg font-semibold
                 hover:shadow-lg hover:scale-[1.02] active:scale-100 transition-all duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Authenticating...
          </span>
        </button>
      </form>
    </div>

    <!-- Admin Dashboard (after login) -->
    <div *ngIf="isClientReady && isAuthenticated">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Admin Panel</h2>
      
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6">
        ✓ You are logged in as admin
      </div>

      <button 
        (click)="onLogout()"
        class="w-full bg-gray-600 hover:bg-gray-700 text-white py-3 px-6 rounded-lg font-semibold
               transition-colors duration-200"
      >
        Logout
      </button>
    </div>
  </div>
</div>
