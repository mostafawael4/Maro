<div class="films-container">
  <!-- Delete Confirmation Modal -->
  <app-delete-modal
    [isOpen]="showDeleteModal"
    [isLoading]="deleteModalLoading"
    title="Delete Film"
    [message]="'Are you sure you want to delete this film?'"
    warning="This action cannot be undone."
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  ></app-delete-modal>

  <!-- Header Section -->
  <div class="header">
    <h1>Our Films</h1>
    <p>"Capturing moments in motion, telling stories through time."</p>
    
    <!-- Upload Button (Admin Only) -->
    <button *ngIf="isAuthenticated && isAdmin" class="upload-btn" (click)="openUploadModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      Upload Film
    </button>
  </div>

  <!-- Upload Modal Component -->
  <app-film-upload-modal 
    [show]="showUploadModal" 
    [uploadFunction]="uploadFilm.bind(this)"
    (closeModal)="closeUploadModal()" 
    (uploadComplete)="onUploadComplete()">
  </app-film-upload-modal>

  <!-- Video Poster Selector Modal -->
  <app-film-video-poster-selector
    *ngIf="showVideoPosterSelector && selectedFilmForThumbnail"
    [filmId]="selectedFilmForThumbnail._id"
    [videoFilename]="selectedFilmForThumbnail.filename"
    [videoUrl]="selectedFilmForThumbnail.url"
    [currentThumbnail]="selectedFilmForThumbnail.thumbnail || undefined"
    (thumbnailSelected)="onThumbnailSelected($event)"
    (close)="onCloseVideoPosterSelector()">
  </app-film-video-poster-selector>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner"></div>
    <p>Loading beautiful films...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage && !isLoading" class="error-container">
    <p>{{ errorMessage }}</p>
    <button (click)="loadFilms()" class="retry-btn">Retry</button>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !errorMessage && films.length === 0" class="empty-container">
    <p>No films available yet.</p>
  </div>

  <!-- Films List -->
  <div *ngIf="!isLoading && !errorMessage && films.length > 0" class="films-list">
    <div 
      *ngFor="let film of films; let i = index" 
      class="film-item"
      [attr.data-index]="i"
      [class.animate-in]="isFilmVisible(i)"
    >
      <!-- Film Video -->
      <div class="film-video-wrapper">
        <video 
          [src]="getFilmUrl(film)"
          [poster]="getThumbnailUrl(film) || ''"
          controls
          class="film-video"
        >
          Your browser does not support the video tag.
        </video>
        <!-- Admin Buttons -->
        <div *ngIf="isAuthenticated && isAdmin" class="admin-buttons">
          <!-- Thumbnail Selector Button -->
          <button 
            class="thumbnail-btn"
            (click)="onSelectVideoThumbnail(film, $event)"
            [attr.aria-label]="'Change thumbnail for ' + film.filename"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <!-- Delete Button -->
          <button 
            class="delete-btn"
            (click)="onDeleteClick(film, $event)"
            [disabled]="isDeleting(film._id)"
            [attr.aria-label]="'Delete ' + film.filename"
          >
            <svg *ngIf="!isDeleting(film._id)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <div *ngIf="isDeleting(film._id)" class="delete-spinner"></div>
          </button>
        </div>
      </div>

      <!-- Film Description Section -->
      <div class="film-description">
        <p class="film-text">{{ film.description || 'No description available.' }}</p>
      </div>
    </div>
  </div>
</div>
