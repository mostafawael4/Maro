<div class="background-image-selector-overlay" (click)="onClose()">
  <div class="background-image-selector-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Select Background Image</h2>
      <button class="close-btn" (click)="onClose()" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="instruction">Select an image from this order to use as the background image.</p>
      
      <div *ngIf="error" class="error-message">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>

      <div class="images-grid" *ngIf="images.length > 0">
        <div 
          *ngFor="let image of images" 
          class="image-item"
          [class.selected]="isSelected(image)"
          (click)="selectImage(image)"
        >
          <img [src]="getImageUrl(image)" [alt]="image.filename" />
          <div class="image-overlay">
            <svg *ngIf="isSelected(image)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="image-filename">{{ image.filename }}</span>
        </div>
      </div>

      <div *ngIf="images.length === 0" class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <p>No images available in this order.</p>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()" [disabled]="isUpdating">Cancel</button>
      <button 
        class="btn-confirm" 
        (click)="confirmSelection()" 
        [disabled]="!selectedImageFilename || isUpdating"
      >
        <span *ngIf="!isUpdating">Set as Background</span>
        <span *ngIf="isUpdating" class="loading-text">
          <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 11-6.219-8.56"/>
          </svg>
          Updating...
        </span>
      </button>
    </div>
  </div>

  <!-- Success Modal -->
  <app-success-modal
    [isOpen]="showSuccessModal"
    type="success"
    title="Success!"
    [message]="successMessage"
    (close)="onSuccessModalClose()"
  ></app-success-modal>

  <!-- Error Modal -->
  <app-success-modal
    [isOpen]="showErrorModal"
    type="error"
    title="Error"
    [message]="errorMessage"
    (close)="onErrorModalClose()"
  ></app-success-modal>
</div>
