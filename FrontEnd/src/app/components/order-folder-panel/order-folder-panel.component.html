<div class="folders-page">

  <!-- Folders Header -->
  <div class="folders-page-header">
    <div class="header-text">
      <h2>Your Albums</h2>
      <p>Select an album to view your photos & videos</p>
    </div>
    <span class="folder-count-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M3 7h6l2 3h10v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
        <path d="M3 7V5a2 2 0 0 1 2-2h4l2 3"></path>
      </svg>
      {{ folders.length }} {{ folders.length === 1 ? 'Album' : 'Albums' }}
    </span>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="folders-loader">
    <div class="loader-ring"></div>
    <p>Loading your albums...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="folders-error">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <p>{{ error }}</p>
  </div>

  <!-- Folders Grid -->
  <div *ngIf="!loading && !error && folders.length > 0" class="folders-grid">
    <div *ngFor="let folder of folders; let i = index" class="folder-card-wrapper">

      <!-- Admin action buttons -->
      <button *ngIf="isAuthenticated" class="folder-action-btn folder-delete-btn"
        (click)="onDeleteFolder(folder, $event)" title="Delete folder">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>

      <!-- Main Folder Card -->
      <button class="folder-card" [class.active]="folder === selectedFolder" (click)="onFolderClick(folder, $event)">

        <!-- Decorative orb -->
        <div class="folder-orb" [style.--orb-hue]="(i * 47 + 10) % 360 + 'deg'"></div>

        <!-- Folder icon area -->
        <div class="folder-icon-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5">
            <path d="M3 7h6l2 3h10v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
            <path d="M3 7V5a2 2 0 0 1 2-2h4l2 3"></path>
          </svg>
        </div>

        <!-- Folder name -->
        <div class="folder-label">
          <span class="folder-name">{{ folder }}</span>
          <span class="folder-size" *ngIf="folderSizes[folder]">{{ formatSize(folderSizes[folder]) }}</span>
          <span class="folder-tap">Tap to open</span>
        </div>

        <!-- Arrow -->
        <div class="folder-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>

      </button>
    </div>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && !error && folders.length === 0" class="folders-empty">
    <div class="empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5">
        <path d="M3 7h6l2 3h10v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
        <path d="M3 7V5a2 2 0 0 1 2-2h4l2 3"></path>
      </svg>
    </div>
    <h3>No Albums Yet</h3>
    <p>Your media albums will appear here once uploaded.</p>
  </div>

</div>
